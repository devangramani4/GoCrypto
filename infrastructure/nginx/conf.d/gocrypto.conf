# Plain-HTTP vhosts for local docker-compose and for deployments behind a TLS-terminating load balancer.
# For direct TLS on this proxy use gocrypto-tls.conf.example instead.

# Shared API / websocket routing for both the trading site and the admin panel.
# (Kept as a snippet so the two server blocks cannot drift apart.)

server {
  listen 80 default_server;
  server_name _;
  limit_conn conn 100;

  include /etc/nginx/conf.d/snippets/security-headers.inc;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws://$host wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  include /etc/nginx/conf.d/snippets/backend-routes.inc;

  location / {
    proxy_pass http://gc_web;
    proxy_set_header Host $host;
  }
}

# Admin panel: separate port (map it to an internal-only listener / VPN in production).
server {
  listen 8081;
  server_name _;
  limit_conn conn 50;

  # Restrict to trusted networks in production, e.g.:
  # allow 10.0.0.0/8;
  # deny all;

  include /etc/nginx/conf.d/snippets/security-headers.inc;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  include /etc/nginx/conf.d/snippets/backend-routes.inc;

  location / {
    proxy_pass http://gc_admin;
    proxy_set_header Host $host;
  }
}
