# Static single-page app (web or admin) behind the edge proxy.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # Fingerprinted build assets: cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routing: unknown paths serve index.html (never cached).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
