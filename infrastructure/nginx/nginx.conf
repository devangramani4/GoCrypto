# GoCrypto edge proxy (docker-compose / VM deployments). TLS termination: see conf.d/gocrypto-tls.conf.example.
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 8192;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;

  log_format main escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method","uri":"$uri",'
                              '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"upstream_rt":"$upstream_response_time",'
                              '"ua":"$http_user_agent","req_id":"$request_id"}';
  access_log /var/log/nginx/access.log main;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Per-client rate limits (the API enforces its own Redis-backed limits as well).
  limit_req_zone $binary_remote_addr zone=api:20m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=wallet:10m rate=30r/m;
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream gc_api {
    server api:4000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }
  upstream gc_ws {
    # Socket.IO runs websocket-only transport, so no sticky sessions are needed; fan-out goes through Redis.
    server websocket:4001 max_fails=3 fail_timeout=10s;
  }
  upstream gc_web {
    server web:80;
  }
  upstream gc_admin {
    server admin:80;
  }

  include /etc/nginx/conf.d/*.conf;
}
