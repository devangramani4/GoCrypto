# Prometheus scrape config for the docker-compose network (service names resolve via Docker DNS).
# When METRICS_TOKEN is set, add `authorization: { credentials_file: /etc/prometheus/metrics-token }` to each job.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs: [{ targets: ['api:4000'] }]
  - job_name: websocket
    metrics_path: /metrics
    static_configs: [{ targets: ['websocket:4001'] }]
  - job_name: matching-engine
    static_configs: [{ targets: ['matching-engine:9101'] }]
  - job_name: risk-engine
    static_configs: [{ targets: ['risk-engine:9102'] }]
  - job_name: market-data
    static_configs: [{ targets: ['market-data:9103'] }]
  - job_name: workers
    static_configs: [{ targets: ['workers:9104'] }]
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]
