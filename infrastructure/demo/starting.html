<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="5" />
    <title>GoCrypto demo is starting</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0d12;
        color: #e7eaf0;
        font: 16px/1.5 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 0 16px;
      }
      h1 { margin: 20px 0 8px; font-size: 24px; letter-spacing: -0.01em; }
      p { margin: 0; color: #8b95a7; max-width: 30em; }
      .bar { width: 160px; height: 4px; margin: 24px auto 0; border-radius: 2px; background: #1f2632; overflow: hidden; }
      .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 2px; background: #2d7bf6; animation: slide 1.2s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; opacity: 0.6; } }
    </style>
  </head>
