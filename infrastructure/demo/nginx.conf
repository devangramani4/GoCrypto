# nginx for the GoCrypto demo container: one port (7860) serves the web app, the REST API and the
# websocket gateway. Started by PM2 with `-p /tmp/gocrypto-demo/nginx/`, so relative paths live there.
worker_processes 2;
pid nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  access_log off;

  client_body_temp_path client_body;
  proxy_temp_path proxy;
  fastcgi_temp_path fastcgi;
  uwsgi_temp_path uwsgi;
  scgi_temp_path scgi;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # The hosting platform's proxy is the only way in, so take client addresses and the original scheme
  # from its forwarding headers.
  set_real_ip_from 0.0.0.0/0;
  set_real_ip_from ::/0;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Per-client rate limits (the API enforces its own Redis-backed limits as well).
  limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=wallet:10m rate=30r/m;
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  upstream gc_api {
    server 127.0.0.1:4000;
    keepalive 16;
  }
  upstream gc_ws {
    server 127.0.0.1:4001;
  }

  server {
    listen 7860 default_server;
    server_name _;
    root /app/web;
    limit_conn conn 100;

    include /app/infrastructure/demo/nginx-security-headers.inc;

    # REST API. Authentication endpoints get a much tighter budget against credential stuffing.
    location ~ ^/api/v1/auth/(login|register|password|oauth|2fa|pin) {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://gc_api;
      include /app/infrastructure/demo/nginx-proxy-api.inc;
    }
    location ~ ^/api/v1/wallet/(withdrawals|internal-transfer) {
      limit_req zone=wallet burst=10 nodelay;
      proxy_pass http://gc_api;
      include /app/infrastructure/demo/nginx-proxy-api.inc;
    }
    location /api/ {
      limit_req zone=api burst=100 nodelay;
      proxy_pass http://gc_api;
      include /app/infrastructure/demo/nginx-proxy-api.inc;
    }

    # Real-time gateway (Socket.IO over websockets).
    location /socket.io/ {
      proxy_pass http://gc_ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Internal endpoints are never exposed.
    location ~ ^/(metrics|ready|docs) {
      return 404;
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }

    # Fingerprinted build assets: cache forever.
    location /assets/ {
      expires 1y;
      include /app/infrastructure/demo/nginx-security-headers.inc;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # The web app. Until the services are up, pages get a "starting" screen that reloads itself.
    location / {
      if (!-f /tmp/gocrypto-demo/ready) {
        return 503;
      }
      include /app/infrastructure/demo/nginx-security-headers.inc;
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }

    error_page 503 /starting.html;
    location = /starting.html {
      internal;
      root /app/infrastructure/demo;
      include /app/infrastructure/demo/nginx-security-headers.inc;
      add_header Cache-Control "no-store" always;
      add_header Retry-After "5" always;
    }

    # While the API is (re)starting, API calls get a JSON answer instead of an nginx error page.
    location @api_unavailable {
      default_type application/json;
      add_header Retry-After "5" always;
      return 503 '{"error":{"code":"SERVICE_STARTING","message":"The demo is starting up. Try again in a few seconds."}}';
    }
  }
}
