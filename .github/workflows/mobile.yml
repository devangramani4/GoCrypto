name: Mobile

# Native builds of the bare React Native app. They take longer than the main CI, so they only run when
# the app or the packages it bundles change.
on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', 'packages/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/mobile.yml']

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  android:
    name: Android release build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: pnpm install --frozen-lockfile
      # Unsigned release APK for one ABI: compiles the native code and Hermes bytecode for the JS bundle.
      # No google-services.json in CI, so push is compiled in but not configured.
      - name: Assemble release
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

  ios:
    name: iOS release build (simulator)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile
      - name: Install pods
        working-directory: apps/mobile/ios
        run: bundle exec pod install
      - name: Build
        working-directory: apps/mobile/ios
        run: >-
          xcodebuild -quiet -workspace GoCrypto.xcworkspace -scheme GoCrypto -configuration Release
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
