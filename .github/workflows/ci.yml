name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  checks:
    name: Lint, typecheck, unit & frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm --filter @gocrypto/api-client --filter @gocrypto/web --filter @gocrypto/admin test
      - run: pnpm build:backend
      - run: pnpm --filter @gocrypto/web build && pnpm --filter @gocrypto/admin build

  integration:
    name: API integration & financial safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: gocrypto_test
          MARIADB_USER: gocrypto
          MARIADB_PASSWORD: gocrypto_ci_pw
          MARIADB_ROOT_PASSWORD: gocrypto_ci_root_pw
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://gocrypto:gocrypto_ci_pw@127.0.0.1:3306/gocrypto_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: infrastructure/docker/backend.Dockerfile
            app: ''
          - name: web
            dockerfile: infrastructure/docker/frontend.Dockerfile
            app: web
          - name: admin
            dockerfile: infrastructure/docker/frontend.Dockerfile
            app: admin
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.app && format('APP={0}', matrix.app) || '' }}
          push: false
          tags: gocrypto/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
